workflows:
  android-workflow:
    name: Flutter WebRTC Android Build

    instance_type: mac_mini_m2

    working_directory: flutter-webrtc-test/example

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
